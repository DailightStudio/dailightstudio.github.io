<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RunRun Apocalypse 우편·쿠폰 관리</title>
<link rel="stylesheet" href="../../admin-kit.css">
</head>
<body>
<h1>RunRun Apocalypse 우편·쿠폰 관리</h1>
<p class="muted">인류 대재앙에서 살아남기 게임 우편함으로 보상을 보내고 쿠폰을 만듭니다. 관리자 계정으로 로그인해야 사용할 수 있습니다.</p>

<div id="auth">
  <span id="who" class="muted">로그인되어 있지 않습니다.</span>
  <button id="login">Google 계정으로 로그인</button>
  <button id="logout" class="secondary hidden">로그아웃</button>
</div>
<p id="status" class="muted"></p>

<div id="app" class="hidden">
  <h2>새 우편</h2>
  <fieldset>
    <label for="title">제목 (우편함에 보이는 이름, 같은 제목은 못 씀)</label>
    <input id="title" maxlength="40" placeholder="예: 업데이트 기념 보상">

    <label>받는 사람</label>
    <div class="inline">
      <select id="targetType" style="width:auto">
        <option value="all">전체 플레이어</option>
        <option value="one">특정 플레이어</option>
      </select>
      <input id="target" class="hidden" placeholder="플레이어 ID (예: g0123...)">
    </div>
    <div id="finder" class="hidden">
      <label for="q">플레이어 찾기 (ID 일부)</label>
      <div class="inline"><input id="q" placeholder="ID 일부"><button id="search" class="secondary">찾기</button></div>
      <div id="results" class="muted results"></div>
    </div>

    <label for="expire">받을 수 있는 마지막 날</label>
    <input id="expire" type="date" style="width:auto">

    <div data-reward="post"></div>
    <p><button id="send">보내기</button> <span id="sendMsg" class="muted"></span></p>
  </fieldset>

  <h2>보낸 우편 <button id="reloadPosts" class="secondary">새로고침</button></h2>
  <p id="cleanMsg" class="muted"></p>
  <table>
    <thead><tr><th>제목</th><th>받는 사람</th><th>마지막 날</th><th>보상</th><th>받은 사람</th><th></th></tr></thead>
    <tbody id="posts"><tr><td colspan="6" class="muted">불러오는 중…</td></tr></tbody>
  </table>

  <h2>새 쿠폰</h2>
  <fieldset>
    <label for="code">쿠폰 코드 (플레이어가 설정 화면에 입력, 한 사람당 한 번)</label>
    <input id="code" maxlength="30" placeholder="예: RUNRUN2026">
    <div class="row">
      <div><span class="muted">골드</span><input id="cGold" type="number" min="0" value="0"></div>
      <div><span class="muted">루비</span><input id="cRuby" type="number" min="0" value="0"></div>
      <div><span class="muted">비늘</span><input id="cScale" type="number" min="0" value="0"></div>
    </div>
    <div data-reward="coupon" data-no-credit></div>
    <p><button id="makeCoupon">만들기</button> <span id="couponMsg" class="muted"></span></p>
  </fieldset>

  <h2>쿠폰 목록 <button id="reloadCoupons" class="secondary">새로고침</button></h2>
  <table>
    <thead><tr><th>코드</th><th>보상</th><th>사용한 사람</th><th></th></tr></thead>
    <tbody id="coupons"><tr><td colspan="4" class="muted">불러오는 중…</td></tr></tbody>
  </table>
</div>

const GRADES = ["C", "B", "A", "S", "S+"];
const CREDIT = { Gold: "골드", Ruby: "루비", Scale: "비늘" };
const stackable = (it) => !!it && (it.t === "Use" || it.t === "Fish");
const findItem = (i) => ITEMS.find((x) => x.i === +i);
const num = (id) => Math.max(0, parseInt($(id).value || "0", 10) || 0);

// 우편과 쿠폰이 같이 쓰는 아이템·재화 입력칸. 만들고 읽는 곳을 한 군데로 둔다.
function rewardFields(box) {
  const p = box.dataset.reward;
  const credit = box.hasAttribute("data-no-credit") ? "" : `
    <label>재화</label>
    <div class="row">
      <div><select id="${p}CreditType"><option value="NONE">없음</option>${Object.entries(CREDIT).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
      <div><input id="${p}Credit" type="number" min="0" value="0"></div>
    </div>`;
  box.innerHTML = credit + `
    <label>아이템</label>
    <div class="row">
      <div style="grid-column:span 2"><select id="${p}Item"><option value="0">없음</option>${ITEMS.map((x) => `<option value="${x.i}">${esc(x.n)} (${x.t})</option>`).join("")}</select></div>
      <div><span class="muted" id="${p}AmtLabel">수량</span><input id="${p}Amt" type="number" min="0" value="1"></div>
      <div><span class="muted">등급</span><select id="${p}Grade">${GRADES.map((g) => `<option>${g}</option>`).join("")}</select></div>
    </div>`;
  const sync = () => {
    const it = findItem($(p + "Item").value);
    $(p + "AmtLabel").textContent = it && !stackable(it) ? "강화(+)" : "수량";
    $(p + "Grade").disabled = !it || stackable(it);
  };
  $(p + "Item").onchange = sync;
  sync();
}
function readItem(p) {
  const it = findItem($(p + "Item").value);
  if (!it) return { index: 0, amount: 0, upgrade: 0, grade: "NONE" };
  return stackable(it)
    ? { index: it.i, amount: Math.max(1, num(p + "Amt")), upgrade: 0, grade: "NONE" }
    : { index: it.i, amount: 1, upgrade: num(p + "Amt"), grade: $(p + "Grade").value };
}
function itemText(i, amount, upgrade, grade) {
  const it = findItem(i);
  if (!(+i > 0)) return "";
  if (!it) return "아이템 #" + i;
  return stackable(it) ? `${it.n} x${amount}` : `${it.n} ${grade} +${upgrade}`;
}
document.querySelectorAll("[data-reward]").forEach(rewardFields);
$("expire").value = daysLater(7);

startAdmin(config, (db) => {
  $("targetType").onchange = () => {
    const one = $("targetType").value === "one";
    $("target").classList.toggle("hidden", !one);
    $("finder").classList.toggle("hidden", !one);
  };

  let users = null;
  $("search").onclick = async () => {
    const q = $("q").value.trim().toLowerCase();
    if (!q) return;
    $("results").textContent = "찾는 중…";
    try {
      if (!users) users = Object.keys((await get(ref(db, "USERS"))).val() || {});
      const hits = users.filter((id) => id.toLowerCase().includes(q)).slice(0, 20);
      $("results").innerHTML = hits.length ? "" : "찾는 플레이어가 없습니다.";
      for (const id of hits) {
        const b = document.createElement("button");
        b.className = "secondary";
        b.textContent = id;
        b.onclick = () => { $("target").value = id; };
        $("results").appendChild(b);
      }
    } catch (e) { $("results").textContent = "검색 실패: " + e.message; }
  };

  $("send").onclick = async () => {
    const title = $("title").value.trim();
    const toOne = $("targetType").value === "one";
    const target = toOne ? $("target").value.trim() : "NULL";
    const date = inputToYmd($("expire").value);
    const creditType = $("postCreditType").value;
    const credit = creditType === "NONE" ? 0 : num("postCredit");
    const item = readItem("post");
    const msg = (t, cls = "err") => { $("sendMsg").className = cls; $("sendMsg").textContent = t; };

    if (!validKey(title)) return msg("제목을 적어주세요. . $ # [ ] / 는 쓸 수 없습니다.");
    if (toOne && !/^[ag]_?\w+$/.test(target)) return msg("플레이어 ID를 확인해주세요.");
    if (!date || date < todayYmd()) return msg("마지막 날은 오늘이거나 그 뒤여야 합니다.");
    if (credit <= 0 && item.index <= 0) return msg("재화나 아이템 중 하나는 넣어주세요.");
    if ((await get(ref(db, "Post/" + title))).exists()) return msg("같은 제목의 우편이 이미 있습니다.");
    const who = toOne ? "플레이어 " + target : "전체 플레이어";
    if (!confirm(`${who}에게 '${title}' 우편을 보냅니다.`)) return;

    $("send").disabled = true;
    try {
      // 게임(FirebaseManager.GetPost)이 모든 필드를 읽으므로 없는 값도 채워서 쓴다.
      await set(ref(db, "Post/" + title), {
        Date: date,
        Target: target,
        Credit: { Type: credit > 0 ? creditType : "NONE", Amount: credit },
        Item: { Index: item.index, Amount: item.amount, Upgrade: item.upgrade, Grade: item.grade },
      });
      msg("보냈습니다.", "ok");
      $("title").value = "";
      loadPosts();
    } catch (e) { msg("보내지 못했습니다: " + e.message); }
    finally { $("send").disabled = false; }
  };

  async function loadPosts() {
    const body = $("posts");
    try {
      const posts = (await get(ref(db, "Post"))).val() || {};
      // 1.0.8 게임은 기한 지난 우편을 지우려다 권한 거부로 우편함 로딩이 멈춘다. 관리 페이지가 대신 지운다.
      const expired = Object.keys(posts).filter((k) => +posts[k].Date < todayYmd());
      for (const k of expired) { await remove(ref(db, "Post/" + k)); delete posts[k]; }
      $("cleanMsg").textContent = expired.length ? `기한이 지난 우편 ${expired.length}개를 지웠습니다.` : "";
      const rows = Object.entries(posts).sort((a, b) => (+b[1].Date || 0) - (+a[1].Date || 0));
      body.innerHTML = rows.length ? "" : '<tr><td colspan="6" class="muted">우편이 없습니다.</td></tr>';
      for (const [title, p] of rows) {
        const c = p.Credit || {}, it = p.Item || {};
        const reward = [c.Type && c.Type !== "NONE" ? `${CREDIT[c.Type] || c.Type} ${(+c.Amount).toLocaleString()}` : "",
          itemText(it.Index, it.Amount, it.Upgrade, it.Grade)].filter(Boolean).join(", ");
        const target = String(p.Target || "");
        const received = target === "NULL" ? Object.keys(p.GetList || {}).length + "명" : (target.endsWith("[수령]") ? "받음" : "안 받음");
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${esc(title)}</td><td>${target === "NULL" ? "전체" : esc(target.replace("[수령]", ""))}</td>
          <td>${p.Date ? ymdToInput(p.Date) : "-"}</td><td>${esc(reward)}</td><td>${received}</td>
          <td><button class="danger">삭제</button></td>`;
        tr.querySelector("button").onclick = async () => {
          if (!confirm(`'${title}' 우편을 지웁니다. 아직 안 받은 플레이어는 더 이상 받을 수 없습니다.`)) return;
          await remove(ref(db, "Post/" + title));
          loadPosts();
        };
        body.appendChild(tr);
      }
    } catch (e) { body.innerHTML = `<tr><td colspan="6" class="err">불러오지 못했습니다: ${esc(e.message)}</td></tr>`; }
  }

  $("makeCoupon").onclick = async () => {
    const code = $("code").value.trim();
    const item = readItem("coupon");
    const gold = num("cGold"), ruby = num("cRuby"), scale = num("cScale");
    const msg = (t, cls = "err") => { $("couponMsg").className = cls; $("couponMsg").textContent = t; };
    if (!validKey(code)) return msg("코드를 적어주세요. . $ # [ ] / 는 쓸 수 없습니다.");
    if (!gold && !ruby && !scale && item.index <= 0) return msg("보상을 하나 이상 넣어주세요.");
    if ((await get(ref(db, "Coupon/" + code))).exists()) return msg("같은 코드가 이미 있습니다.");
    try {
      await set(ref(db, "Coupon/" + code), {
        Gold: gold, Ruby: ruby, Scale: scale,
        ItemIndex: item.index, ItemAmount: item.amount, ItemUpgrade: item.upgrade, ItemGrade: item.grade,
      });
      msg("만들었습니다.", "ok");
      $("code").value = "";
      loadCoupons();
    } catch (e) { msg("만들지 못했습니다: " + e.message); }
  };

  async function loadCoupons() {
    const body = $("coupons");
    try {
      const rows = Object.entries((await get(ref(db, "Coupon"))).val() || {});
      body.innerHTML = rows.length ? "" : '<tr><td colspan="4" class="muted">쿠폰이 없습니다.</td></tr>';
      for (const [code, c] of rows) {
        const reward = [c.Gold > 0 ? "골드 " + c.Gold : "", c.Ruby > 0 ? "루비 " + c.Ruby : "", c.Scale > 0 ? "비늘 " + c.Scale : "",
          itemText(c.ItemIndex, c.ItemAmount, c.ItemUpgrade, c.ItemGrade)].filter(Boolean).join(", ");
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${esc(code)}</td><td>${esc(reward)}</td><td>${Object.keys(c.Enabled || {}).length}명</td><td><button class="danger">삭제</button></td>`;
        tr.querySelector("button").onclick = async () => {
          if (!confirm(`쿠폰 '${code}' 를 지웁니다.`)) return;
          await remove(ref(db, "Coupon/" + code));
          loadCoupons();
        };
        body.appendChild(tr);
      }
    } catch (e) { body.innerHTML = `<tr><td colspan="4" class="err">불러오지 못했습니다: ${esc(e.message)}</td></tr>`; }
  }

  $("reloadPosts").onclick = loadPosts;
  $("reloadCoupons").onclick = loadCoupons;
  loadPosts();
  loadCoupons();
});
</script>
</body>
</html>
